services:
  app:
    build: .
    image: akaunting:php8.4.27
    ports:
      - "8080:80"
    environment:
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: akaunting
      DB_USERNAME: akaunting
      DB_PASSWORD: akaunting
      AKAUNTING_ADMIN_EMAIL: admin@akaunting.test
      AKAUNTING_ADMIN_PASSWORD: password
    depends_on:
      - db

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: akaunting
      MARIADB_USER: akaunting
      MARIADB_PASSWORD: akaunting
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
